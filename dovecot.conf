protocols = imap
listen = *
ssl = required
ssl_cert = </etc/dovecot/qa.crt
ssl_key = </etc/dovecot/qa.key
disable_plaintext_auth = yes
auth_mechanisms = plain login
mail_location = maildir:~/Maildir
passdb {
 driver = static
 args = nopassword=y
}
userdb {
 driver = static
 args = uid=5000 gid=5000 home=/home/vmail
}
service imap-login {
 inet_listener imap {
  port = 0
 }
 inet_listener imaps {
  port = 993
  ssl = yes
 }
}
log_path = /dev/stderr
info_log_path = /dev/stdout
